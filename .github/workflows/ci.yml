name: data-platform-ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: python -m pip install -e ".[dev]" -e ./sdk/python
      - name: Dependency lock consistency
        run: python scripts/check_dependency_lock.py
      - name: Ruff
        run: python -m ruff check src tests sdk/python/src scripts/audit_modules.py scripts/check_dependency_lock.py
      - name: Tests
        run: python -m pytest

  javascript-sdk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: JavaScript SDK tests
        run: node --test tests/sdk/javascript_client.test.mjs

  postgres-integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: arvectum_ci
          POSTGRES_PASSWORD: local_ci_only
          POSTGRES_DB: arvectum_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U arvectum_ci -d arvectum_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: python -m pip install -e ".[dev]" -e ./sdk/python
      - name: PostgreSQL + pgvector integration
        env:
          ARVECTUM_DATA_TEST_DATABASE_URL: postgresql+psycopg://arvectum_ci:local_ci_only@127.0.0.1:5432/arvectum_ci
        run: python -m pytest -q -m postgres
