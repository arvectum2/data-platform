name: Mirror to GitVerse

on:
  push:
    branches:
      - '**'
    tags:
      - '**'
  workflow_dispatch:
  schedule:
    - cron: '17 3 * * *'

permissions:
  contents: read

concurrency:
  group: mirror-to-gitverse
  cancel-in-progress: false

jobs:
  mirror:
    name: Mirror repository
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Validate configuration
        env:
          GITVERSE_TOKEN: ${{ secrets.GITVERSE_TOKEN }}
          GITVERSE_REPOSITORY: ${{ vars.GITVERSE_REPO }}
        run: |
          set -euo pipefail
          test -n "$GITVERSE_TOKEN" || { echo "::error::GITVERSE_TOKEN is missing"; exit 1; }
          test -n "$GITVERSE_REPOSITORY" || { echo "::error::GITVERSE_REPO is missing"; exit 1; }

      - name: Clone GitHub repository as mirror
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          git clone --mirror \
            "https://x-access-token:${GH_TOKEN}@github.com/${GH_REPOSITORY}.git" \
            repository.git

      - name: Push branches and tags to GitVerse
        env:
          GITVERSE_TOKEN: ${{ secrets.GITVERSE_TOKEN }}
          GITVERSE_REPOSITORY: ${{ vars.GITVERSE_REPO }}
        run: |
          set -euo pipefail
          cd repository.git

          git remote add gitverse \
            "https://arvectum:${GITVERSE_TOKEN}@gitverse.ru/arvectum/${GITVERSE_REPOSITORY}.git"

          # Mirror only normal branches and tags.
          # GitHub-specific refs/pull/* are intentionally excluded.
          # Mirror push is idempotent for a fixed clone and may hit intermittent
          # GitVerse HTTP 502. Retry transport failures without masking a
          # persistent error, and never echo a credential-bearing remote URL.
          for attempt in $(seq 1 5); do
            if git push --force --prune gitverse \
              'refs/heads/*:refs/heads/*' \
              'refs/tags/*:refs/tags/*' >/dev/null 2>&1; then
              echo "GitVerse mirror push completed (attempt ${attempt}/5)."
              exit 0
            fi
            echo "::warning::GitVerse mirror push failed (attempt ${attempt}/5); retrying."
            sleep 10
          done

          echo "::error::GitVerse mirror push failed after five attempts (check network/auth)."
          exit 1

      - name: Summary
        if: success()
        env:
          GITVERSE_REPOSITORY: ${{ vars.GITVERSE_REPO }}
        run: |
          echo "### GitVerse mirror updated" >> "$GITHUB_STEP_SUMMARY"
          echo "- Source: ${GITHUB_REPOSITORY}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Target: arvectum/${GITVERSE_REPOSITORY}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Trigger: ${GITHUB_EVENT_NAME}" >> "$GITHUB_STEP_SUMMARY"
          echo "- SHA: ${GITHUB_SHA}" >> "$GITHUB_STEP_SUMMARY"
