name: GitVerse Mirror Health

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Verify GitVerse main mirror
    runs-on: ubuntu-latest
    timeout-minutes: 3

    steps:
      - name: Compare GitVerse main to current GitHub main
        env:
          GITVERSE_TOKEN: ${{ secrets.GITVERSE_TOKEN }}
          GH_TOKEN: ${{ github.token }}
          GH_REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          test -n "$GITVERSE_TOKEN" || { echo "::error::GITVERSE_TOKEN is missing"; exit 1; }

          expected_sha="$(git ls-remote \
            "https://x-access-token:${GH_TOKEN}@github.com/${GH_REPOSITORY}.git" \
            refs/heads/main | awk '{print $1}')"
          test -n "$expected_sha" || { echo "::error::GitHub main could not be resolved"; exit 1; }

          remote_url="https://arvectum:${GITVERSE_TOKEN}@gitverse.ru/arvectum/data-platform.git"

          successful_reads=0
          for attempt in $(seq 1 12); do
            # A transient HTTP 502 must not abort the existing retry loop.
            if actual_sha="$(git ls-remote "$remote_url" refs/heads/main 2>/dev/null | awk '{print $1}')"; then
              successful_reads=$((successful_reads + 1))
              if [ "$actual_sha" = "$expected_sha" ]; then
                echo "GitVerse main matches current GitHub main: $expected_sha"
                exit 0
              fi
              echo "Mirror not converged yet (attempt ${attempt}/12)."
            else
              echo "::warning::GitVerse query failed (attempt ${attempt}/12); retrying."
            fi
            sleep 5
          done

          if [ "$successful_reads" -eq 0 ]; then
            echo "::error::GitVerse main could not be queried after 12 attempts (check network/auth)."
          else
            echo "::error::GitVerse mirror did not converge to current GitHub main ${expected_sha}."
          fi
          exit 1
