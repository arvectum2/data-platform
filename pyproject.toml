[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "arvectum-data"
version = "0.4.0"
description = "Shared acquisition, extraction, indexing and search foundation for Arvectum products"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "alembic>=1.14,<2.0",
  "pgvector>=0.5,<1.0",
  "psycopg[binary]>=3.1,<4.0",
  "sqlalchemy>=2.0,<3.0",
  "fastapi>=0.115,<1.0",
  "openpyxl>=3.1,<4.0",
  "pypdf>=5.0,<7.0",
  "pydantic-settings>=2.6,<3.0",
  "uvicorn>=0.32,<1.0",
]

[project.optional-dependencies]
browser = [
  "playwright>=1.48,<2.0",
]
dev = [
  "httpx>=0.28,<1.0",
  "pytest>=8.3,<9.0",
  "ruff>=0.8,<1.0",
]

[project.scripts]
arvectum-data = "arvectum_data.api.app:run"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["arvectum_data*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
markers = ["postgres: integration tests requiring PostgreSQL with pgvector"]

[tool.ruff]
target-version = "py311"
line-length = 100
exclude = [".venv"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
ignore = ["F402"]
