[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "arvectum-data-client"
version = "0.1.0"
description = "Lightweight HTTP consumer SDK for Arvectum Data Platform"
requires-python = ">=3.11"
dependencies = [
  "httpx>=0.27,<1.0",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["arvectum_data_client*"]
